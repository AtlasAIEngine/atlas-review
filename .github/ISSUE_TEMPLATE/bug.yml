name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Atlas Review version and operating system
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs with credentials and private code removed
